# ==============================================================================
# Nginx Reverse Proxy Configuration
# Automated Image Preprocessing System Using AWS - Module 7
# Target Path on EC2: /etc/nginx/conf.d/image_preprocessing.conf
# ==============================================================================

upstream flask_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maximum upload size strictly matching application limit (10 MB)
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_body_timeout 120s;

    # Logging
    access_log /var/log/nginx/image_preprocessing_access.log combined;
    error_log /var/log/nginx/image_preprocessing_error.log warn;

    # Gzip Compression for Frontend Assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security: Deny direct access to hidden files and sensitive file extensions
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(py|pyc|sql|sh|md|example|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Serve Static Assets Directly (Bypasses Python WSGI for high performance)
    location /static/ {
        alias /var/www/aws-image-preprocessing/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Reverse Proxy to Gunicorn WSGI Server
    location / {
        proxy_pass http://flask_gunicorn;
        proxy_http_version 1.1;

        # Forward Original Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Extended timeouts for multipart image uploads & S3 streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming uploads
        proxy_buffering off;
        proxy_redirect off;
    }

    # Graceful 50x Error Page
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

